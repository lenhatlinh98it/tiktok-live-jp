<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fishing Pond Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&family=Yuji+Syuku&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pond.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="flash" class="flash"></div>

  <div class="title">釣り堀ライブ</div>
  <div class="hud">
    <div class="panel">
      <div class="ptitle">🏆 今日のランキング</div>
      <ol id="rank"></ol>
    </div>
    <div class="panel">
      <div class="ptitle">🐟 最大魚レコード</div>
      <div id="record" class="record">—</div>
      <div class="ptitle small">最近の大物</div>
      <ul id="feed"></ul>
    </div>
  </div>
  <div class="golden">
    <div class="gtext" id="gtext">❤️ いいね <b id="likes">0</b> / 500 で <b>黄金タイム</b></div>
    <div class="gbar"><i id="gbar"></i></div>
  </div>

  <div id="labels"></div>
  <div id="banner"></div>
  <div id="card"></div>

  <div class="legend">
    <div class="lg-how" id="lgHow">
      <div class="row"><b>💬 コメントで参加！</b> 席に座ると自動で釣り続けます ・ 最大24人</div>
      <div class="row gift-row">🎁 ギフトで<b>即ヒット＆道具強化</b> ・ <b>100💎〜</b>は池全体に<b>撒き餌</b>（20秒 爆釣）</div>
      <div class="gear-grid">
        <div><span>無料</span>🎋 竹竿</div>
        <div><span>1〜9💎</span>🪱 特製エサ（5回）ゴミなし</div>
        <div><span>10〜99💎</span>🎣 カーボン竿（10回）★2以上確定</div>
        <div><span>100〜499💎</span>✨ 金の竿（10回）★3以上確定</div>
        <div class="wide"><span>500💎〜</span>👑 伝説の竿（5回）★4以上確定</div>
      </div>
    </div>
    <div class="lg-odds" id="lgOdds"></div>
  </div>
  <div id="status"></div>
</div>
<script type="module" src="pond.js"></script>
</body>
</html>
